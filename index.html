<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Secure Chat</title>
<link rel="stylesheet" href="/assets/chat.css">
</head>
<body>
<div id="chat-app"></div>
<script type="module">
import {registerDevice,getRoomKeys,saveRoomKey,listDevices,me,login,register,listRooms,createRoom,listMessages,sendMessage,connectRoom,uploadEncryptedMedia,uploadVoice,logout,inviteToRoom,acceptInvite,deleteMedia} from "/assets/chat-api.mjs";
import {generateDeviceKeyPair,loadDevicePrivateKey,saveDevicePrivateKey,importPrivateKey,importPublicKey,wrapRoomKey,unwrapRoomKey,generateRoomKey,encryptText,decryptText,encryptFile,decryptBlob} from "/assets/chat-crypto.mjs";
const root=document.querySelector("#chat-app"),DEVICE_PRIVATE="secure_chat_device_private_v1",DEVICE_ID="secure_chat_device_id_v1";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const normalize=m=>({...m,sender_id:m.sender_id??m.senderId,created_at:m.created_at??m.createdAt,media_key:m.media_key??m.mediaKey});
let state={user:null,rooms:[],room:null,messages:[],keys:new Map(),ws:null,wsState:"closed"},recorder=null,recordChunks=[];
async function ensureDevice(){const id=localStorage.getItem(DEVICE_ID);let privateKey=await loadDevicePrivateKey().catch(()=>null);if(privateKey&&id)return{id,privateKey};const legacy=localStorage.getItem(DEVICE_PRIVATE);if(legacy&&id){privateKey=await importPrivateKey(JSON.parse(legacy));await saveDevicePrivateKey(privateKey);localStorage.removeItem(DEVICE_PRIVATE);return{id,privateKey}}const pair=await generateDeviceKeyPair(),r=await registerDevice({name:navigator.userAgent.slice(0,60),publicKey:JSON.stringify(pair.publicJwk)});await saveDevicePrivateKey(pair.privateKey);localStorage.setItem(DEVICE_ID,r.deviceId);return{id:r.deviceId,privateKey:pair.privateKey}}
async function restoreOwnRoomKey(roomId){const d=await ensureDevice(),rows=(await getRoomKeys(roomId)).keys||[],mine=rows.find(x=>x.device_id===d.id);return mine?unwrapRoomKey(d.privateKey,JSON.parse(mine.encrypted_key)):null}
async function saveOwnRoomKey(roomId,key){const d=await ensureDevice(),rows=(await getRoomKeys(roomId)).keys||[],mine=rows.find(x=>x.device_id===d.id);if(mine)return;const devices=await listDevices(),mineDevice=(devices.devices||[]).find(x=>x.id===d.id);if(!mineDevice)throw new Error("设备注册失败");const envelope=await wrapRoomKey(await importPublicKey(JSON.parse(mineDevice.public_key)),key);await saveRoomKey(roomId,{deviceId:d.id,encryptedKey:JSON.stringify(envelope)})}
async function distributeRoomKey(roomId,key){const d=await ensureDevice(),r=await fetch("/api/chat/rooms/"+encodeURIComponent(roomId)+"/members/devices",{credentials:"include"});if(!r.ok)return;const data=await r.json();for(const target of (data.devices||[]).filter(x=>x.id!==d.id)){try{const envelope=await wrapRoomKey(await importPublicKey(JSON.parse(target.public_key)),key);await fetch("/api/chat/rooms/"+encodeURIComponent(roomId)+"/keys/share",{method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify({deviceId:target.id,encryptedKey:JSON.stringify(envelope)})})}catch{}}}
async function loadRoomKey(room){let key=state.keys.get(room.id);if(key)return key;key=await restoreOwnRoomKey(room.id);if(!key){if(room.owner_id!==state.user.id)throw new Error("等待房间密钥分发");key=await generateRoomKey();await saveOwnRoomKey(room.id,key)}state.keys.set(room.id,key);await distributeRoomKey(room.id,key);return key}
function render(){if(!state.user){root.innerHTML='<main class="chat-auth"><section class="chat-card"><div class="brand">Secure Chat</div><h1>安全通信</h1><p class="muted">端到端加密 · 72 小时自动清理</p><div class="tabs"><button data-auth="login" class="active">登录</button><button data-auth="register">注册</button></div><form id="auth"><input name="email" type="email" placeholder="邮箱" required><input name="password" type="password" placeholder="密码（至少 8 位）" required><input name="nickname" placeholder="昵称" style="display:none"><button class="primary">继续</button><div id="auth-error" class="error"></div></form></section></main>';return}const room=state.room,messages=state.messages.map(m=>m.kind==="text"?'<div class="bubble '+(m.sender_id===state.user.id?"me":"")+'">'+esc(m.text)+'<small>'+new Date(m.created_at).toLocaleTimeString()+'</small></div>':'<div class="bubble '+(m.sender_id===state.user.id?"me":"")+'" data-mid="'+esc(m.id)+'"><div class="media-placeholder">🔒 加密媒体，点击查看</div><small>'+new Date(m.created_at).toLocaleTimeString()+'</small></div>').join("");root.innerHTML='<main class="chat-shell"><aside class="chat-sidebar"><div class="side-head"><div><strong>'+esc(state.user.nickname)+'</strong><small>'+esc(state.user.email)+'</small></div><div class="side-actions"><button id="accept-invite">接受邀请</button><button id="logout">退出</button></div></div><div class="room-create"><input id="room-name" placeholder="新建安全房间"><button id="new-room">＋</button></div><div class="room-list">'+(state.rooms.map(r=>'<button class="room-item '+(room?.id===r.id?"active":"")+'" data-room="'+esc(r.id)+'"><b>'+esc(r.name)+'</b><small>剩余 '+Math.max(0,Math.ceil((r.expires_at-Date.now())/3600000))+' 小时</small></button>').join("")||'<div class="chat-empty">还没有房间</div>')+'</div></aside><section class="chat-main"><header class="chat-header"><div><strong>'+esc(room?.name||"选择房间")+'</strong><small>'+(room?(state.wsState==="open"?"已连接 · 端到端加密":"连接中…"):"")+'</small></div>'+(room&&room.owner_id===state.user.id?'<button id="invite-member" class="record-btn">邀请成员</button>':'')+'</header><div class="chat-messages" id="messages">'+(messages||'<div class="chat-empty">选择一个房间开始安全通信</div>')+'</div><form class="chat-compose" id="compose"><input id="message" placeholder="输入加密消息…" autocomplete="off" '+(room?"":"disabled")+'><input id="media" type="file" accept="*/*" '+(room?"":"disabled")+'><button type="button" id="record" class="record-btn" '+(room?"":"disabled")+'>🎙</button><button class="primary" '+(room?"":"disabled")+'>发送</button></form></section></main>'}
async function refreshRooms(){state.rooms=(await listRooms()).rooms||[];if(state.room)state.room=state.rooms.find(r=>r.id===state.room.id)||null;render()}
let keyRefreshTimer=null;\nasync function startOwnerKeyRefresh(){clearInterval(keyRefreshTimer);if(!state.room||state.room.owner_id!==state.user.id)return;keyRefreshTimer=setInterval(async()=>{if(!state.room)return;const key=state.keys.get(state.room.id);if(key)await distributeRoomKey(state.room.id,key)},10000)}\nasync function openRoom(id){clearInterval(keyRefreshTimer);state.ws?.close();state.ws=null;state.room=state.rooms.find(r=>r.id===id)||null;state.messages=[];render();if(!state.room)return;try{const key=await loadRoomKey(state.room),data=await listMessages(id);for(const raw of data.messages||[]){const m=normalize(raw);let text="无法解密的消息";if(m.kind==="text"){try{text=await decryptText(key,JSON.parse(m.ciphertext))}catch{}}state.messages.push({...m,text})}state.ws=connectRoom(id,async packet=>{const m=normalize(packet?.message);if(!m||m.roomId!==id||state.messages.some(x=>x.id===m.id))return;let text="无法解密的消息";if(m.kind==="text"){try{text=await decryptText(key,JSON.parse(m.ciphertext))}catch{}}state.messages.push({...m,text});state.messages.sort((a,b)=>a.created_at-b.created_at);render()},async s=>{state.wsState=s;if(s==="open"){try{const d=await listMessages(id);for(const raw of d.messages||[]){const m=normalize(raw);if(state.messages.some(x=>x.id===m.id))continue;let text="无法解密的消息";if(m.kind==="text"){try{text=await decryptText(key,JSON.parse(m.ciphertext))}catch{}}state.messages.push({...m,text})}state.messages.sort((a,b)=>a.created_at-b.created_at)}catch{}render()}else render()});render();startOwnerKeyRefresh()}catch(e){alert(e.message||"房间密钥不可用");render()}}
root.addEventListener("click",async e=>{const authTab=e.target.closest("[data-auth]");if(authTab){document.querySelectorAll("[data-auth]").forEach(x=>x.classList.remove("active"));authTab.classList.add("active");const n=document.querySelector('[name="nickname"]');if(n)n.style.display=authTab.dataset.auth==="register"?"block":"none";root.dataset.mode=authTab.dataset.auth;return}const room=e.target.closest("[data-room]");if(room){await openRoom(room.dataset.room);return}if(e.target.id==="new-room"){const n=document.querySelector("#room-name")?.value.trim();if(!n)return;try{const r=await createRoom(n),key=await generateRoomKey();state.keys.set(r.room.id,key);await saveOwnRoomKey(r.room.id,key);await distributeRoomKey(r.room.id,key);await refreshRooms();await openRoom(r.room.id)}catch(x){alert(x.message)}return}if(e.target.id==="invite-member"&&state.room){const email=prompt("输入成员邮箱");if(email)try{await inviteToRoom(state.room.id,email);alert("邀请已创建，请把邀请 ID 发送给对方")}catch(x){alert(x.message)}return}if(e.target.id==="accept-invite"){const id=prompt("输入邀请 ID");if(id)try{const r=await acceptInvite(id);await refreshRooms();await openRoom(r.roomId)}catch(x){alert(x.message)}return}if(e.target.id==="logout"){try{await logout()}catch{}clearInterval(keyRefreshTimer);keyRefreshTimer=null;state.ws?.close();state={user:null,rooms:[],room:null,messages:[],keys:new Map(),ws:null,wsState:"closed"};root.dataset.mode="login";render();return}const media=e.target.closest("[data-mid]");if(media&&state.room){const m=state.messages.find(x=>x.id===media.dataset.mid);if(!m||m.kind==="text"||!m.media_key)return;try{const key=state.keys.get(state.room.id),r=await fetch("/api/chat/rooms/"+encodeURIComponent(state.room.id)+"/media?key="+encodeURIComponent(m.media_key),{credentials:"include"});if(!r.ok)throw new Error();const blob=await r.blob(),meta=JSON.parse(m.ciphertext),out=await decryptBlob(key,blob,meta.iv,meta.type),url=URL.createObjectURL(out);if(m.kind==="file"){const a=document.createElement("a");a.className="file-download";a.href=url;a.download=meta.name||"download";a.textContent="⬇️ "+(meta.name||"下载文件");media.querySelector(".media-placeholder").replaceWith(a)}else media.querySelector(".media-placeholder").outerHTML=m.kind==="image"?'<img class="chat-media" src="'+url+'">':m.kind==="video"?'<video class="chat-media" controls src="'+url+'"></video>':'<audio controls src="'+url+'"></audio>'}catch{media.querySelector(".media-placeholder").textContent="媒体解密失败"}}if(e.target.id==="record"&&state.room){if(recorder?.state==="recording"){recorder.stop();e.target.textContent="🎙";return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);recordChunks=[];recorder.ondataavailable=v=>{if(v.data.size)recordChunks.push(v.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());try{const blob=new Blob(recordChunks,{type:recorder.mimeType||"audio/webm"}),key=state.keys.get(state.room.id),enc=await encryptFile(key,blob),up=await uploadVoice(state.room.id,enc.blob);try{await sendMessage(state.room.id,{kind:"audio",ciphertext:JSON.stringify({iv:enc.iv,name:"voice.webm",type:blob.type,size:blob.size}),mediaKey:up.mediaKey})}catch(err){try{await deleteMedia(state.room.id,up.mediaKey)}catch{}throw err}await openRoom(state.room.id)}catch(x){alert(x.message)}};recorder.start();e.target.textContent="⏹"}catch{alert("无法访问麦克风，请检查浏览器权限")}}});
root.addEventListener("submit",async e=>{e.preventDefault();if(e.target.id==="auth"){const f=new FormData(e.target);try{if((root.dataset.mode||"login")==="register"){await register({email:f.get("email"),password:f.get("password"),nickname:f.get("nickname")});await login({email:f.get("email"),password:f.get("password")})}else await login({email:f.get("email"),password:f.get("password")});state.user=(await me()).user;await refreshRooms()}catch(x){const er=document.querySelector("#auth-error");if(er)er.textContent=x.message}return}if(e.target.id==="compose"&&state.room){try{const input=document.querySelector("#message"),mediaInput=document.querySelector("#media"),file=mediaInput?.files?.[0],key=state.keys.get(state.room.id);if(file){const enc=await encryptFile(key,file),up=await uploadEncryptedMedia(state.room.id,enc.blob);try{await sendMessage(state.room.id,{kind:file.type.startsWith("image/")?"image":file.type.startsWith("video/")?"video":file.type.startsWith("audio/")?"audio":"file",ciphertext:JSON.stringify({iv:enc.iv,name:file.name,type:file.type,size:file.size}),mediaKey:up.mediaKey);mediaInput.value=""}catch(err){try{await deleteMedia(state.room.id,up.mediaKey)}catch{}throw err}}else{const text=input.value.trim();if(!text)return;await sendMessage(state.room.id,{kind:"text",ciphertext:JSON.stringify(await encryptText(key,text))});input.value=""}await openRoom(state.room.id)}catch(x){alert(x.message)}}});
(async()=>{try{state.user=(await me()).user;await refreshRooms()}catch{state.user=null;root.dataset.mode="login";render()}})();
</script>
</body>
</html>
